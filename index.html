<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Голубь</title><style>body{margin:0;min-height:100vh;background:#14110f;color:#e8dcc4;display:grid;place-content:center;font:18px system-ui;text-align:center}#error{color:#ff9d87;max-width:600px}</style><p id="status">Загрузка…</p><p id="error" role="alert"></p><script type="module">
try{const response=await fetch(new URL('./current.json',location.href),{cache:'no-store'});if(!response.ok)throw new Error('Не удалось получить версию игры');const pointer=await response.json();if(pointer.schemaVersion!==1||!/^releases\/[a-zA-Z0-9-]+\/index\.html$/.test(pointer.entry)||!/^releases\/[a-zA-Z0-9-]+\/release\.json$/.test(pointer.manifest))throw new Error('Неверный указатель версии');const manifestResponse=await fetch(new URL(pointer.manifest,location.href));if(!manifestResponse.ok)throw new Error('Файлы версии недоступны');const bytes=await manifestResponse.arrayBuffer(),digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(n=>n.toString(16).padStart(2,'0')).join('');if(digest!==pointer.manifestHash)throw new Error('Версия не прошла проверку целостности');const manifest=JSON.parse(new TextDecoder().decode(bytes));if(manifest.id!==pointer.id||manifest.storage.formatVersion!==1||manifest.storage.schemaVersion!==1)throw new Error('Версия требует обновления страницы');const entry=new URL(pointer.entry,location.href);entry.search=location.search;entry.hash=location.hash;location.replace(entry.href);}catch(error){document.querySelector('#status').textContent='Игра пока недоступна';document.querySelector('#error').textContent=error.message;window.releaseFailure=error.message;}
</script></html>
