<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Голубь · Pascal / Wasm</title>
<style>body{margin:0;background:#14110f;color:#e8dcc4;font:18px system-ui;min-height:100vh;display:grid;place-items:center}main{max-width:620px;padding:40px}h1{font-size:56px;margin:0 0 20px}a{color:#f2c14e}#play{display:inline-block;padding:14px 26px;background:#f2c14e;color:#14110f;text-decoration:none;font-weight:700;border-radius:8px}nav{display:flex;gap:24px;flex-wrap:wrap;margin-top:32px}#error{white-space:pre-wrap;color:#ff9d87}</style>
<main><h1>Голубь</h1><p>Игра про городского голубя. Оригинальный Pascal-код, графика и звук — теперь в браузере.</p><p id="status">Проверяем версию…</p><a id="play" hidden>Играть</a><p>Нужны компьютер, клавиатура и мышь. Звук включается после первого нажатия. Сохранения v2 хранятся отдельно от первой версии.</p><p id="error" role="alert"></p><nav><a href="./progress.html">Ход переноса и подробный план</a><a href="https://andrewsboev.github.io/golub-play/">Первая версия</a></nav></main>
<script type="module">
try{const response=await fetch(new URL('./current.json',location.href),{cache:'no-store'});if(!response.ok)throw new Error('Не удалось получить версию игры');const pointer=await response.json();if(pointer.schemaVersion!==1||!/^releases\/[a-zA-Z0-9-]+\/index\.html$/.test(pointer.entry)||!/^releases\/[a-zA-Z0-9-]+\/release\.json$/.test(pointer.manifest))throw new Error('Неверный указатель версии');const manifestResponse=await fetch(new URL(pointer.manifest,location.href));if(!manifestResponse.ok)throw new Error('Файлы версии недоступны');const bytes=await manifestResponse.arrayBuffer(),digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(n=>n.toString(16).padStart(2,'0')).join('');if(digest!==pointer.manifestHash)throw new Error('Версия не прошла проверку целостности');const manifest=JSON.parse(new TextDecoder().decode(bytes));if(manifest.id!==pointer.id||manifest.storage.formatVersion!==1||manifest.storage.schemaVersion!==1)throw new Error('Версия требует обновления страницы');document.querySelector('#status').textContent='Версия '+pointer.id;const play=document.querySelector('#play');play.href=new URL(pointer.entry,location.href).href;play.hidden=false;window.releaseReady=pointer.id;}catch(error){document.querySelector('#status').textContent='Игра пока недоступна';document.querySelector('#error').textContent=error.message;window.releaseFailure=error.message;}
</script></html>
