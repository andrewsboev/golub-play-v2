<title>PiGine · общие контракты</title><style>body{font:18px system-ui;max-width:850px;margin:4rem auto;padding:1rem;background:#121824;color:#edf3ff}a{color:#8dcaff}pre{white-space:pre-wrap}</style>
<h1>Этап 3 · общая часть PiGine</h1>
<p>Тест компилирует gfx, nodes, engine, UI, кино и сеточную анимацию без Windows и D3D9. Проверяет раскладку вершин, сборку батчей, порядок clip/grab и текстовые стили. Отрисовка игры появится на следующих этапах.</p>
<pre id="result">Проверка…</pre><a href="../../../#plan">Подробный план переноса</a>
<script type="module">
import {createRuntime} from './wasm-runtime.mjs';
try{
 const configuration=new URLSearchParams(location.search).get('configuration')==='Debug'?'Debug':'Release';
 const response=await fetch(`./${configuration}/contracts.wasm`);if(!response.ok)throw new Error(`HTTP ${response.status}`);
 const runtime=await createRuntime(await response.arrayBuffer(),{log(){}});runtime.initialize();
 if(runtime.call('run')!==1)throw new Error(new TextDecoder().decode(new Uint8Array(runtime.memory.buffer,runtime.call('text_ptr'),runtime.call('text_len'))));
 window.spikeResult=JSON.parse(new TextDecoder().decode(new Uint8Array(runtime.memory.buffer,runtime.call('text_ptr'),runtime.call('text_len'))));
 document.querySelector('#result').textContent=JSON.stringify(window.spikeResult,null,2);
}catch(error){window.spikeResult={status:'failed',error:error.message};document.querySelector('#result').textContent=error.message}
</script></html>
